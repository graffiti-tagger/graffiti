services:
  graffiti:
    image: ghcr.io/poaudet/graffiti:latest
    container_name: graffiti
    environment:
      - TZ=Etc/UTC
      - NODE_ENV=production
      - PORT=3001
      - GT_CONFIG_DIR=/config
      - GT_DATA_DIR=/data
      - GT_LIBRARY_PATH=/music
      - GT_INBOX_PATH=/inbox
    volumes:
      - ./config:/config
      - ./data:/data
      - ${MUSIC_LIBRARY_PATH:-~/Music}:/music
      - ${INBOX_PATH:-./inbox}:/inbox
    ports:
      - ${PORT:-3001}:3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/settings').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
